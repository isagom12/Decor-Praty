<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temas Masculinos - DecorPraty</title>
    <link rel="stylesheet" href="temas-masculinos.css">
</head>

<body>
    <header>
        <h1>Catálogo</h1>
        <nav>
            <a href="catalogo.html">Aniversários</a>
            <a href="#">Sociais</a>
            <a href="#">Informativas</a>
            <a href="#">Temáticas</a>
            <a href="#">Sazonais</a>
        </nav>
    </header>

    <main>
        <section class="catalog">
            <h2>Categoria: Temas Masculinos</h2>
            <div class="catalog-row">
                <div class="catalog-item">
                    <img src="./imagens-catalogo/homem-aranha.jpg" alt="Kit festa Homem-Aranha">
                    <button class="btn-aranha">Kit festa Homem-Aranha</button>
                </div>
                <div class="catalog-item">
                    <img src="./imagens-catalogo/ben-10.jpg" alt="Kit festa Ben-10">
                    <button class="btn-ben">Kit festa Ben-10</button>
                </div>
                <div class="catalog-item">
                    <img src="./imagens-catalogo/patrulha.jpg" alt="Kit festa Patrulha-Canina">
                    <button class="btn-patrulha">Kit festa Patrulha-Canina</button>
                </div>
            </div>
            <div class="catalog-row">
                <div class="catalog-item">
                    <img src="./imagens-catalogo/cebolinha.jpg" alt="Kit festa Cebolinha">
                    <button class="btn-cebolinha">Kit festa Cebolinha</button>
                </div>
                <div class="catalog-item">
                    <img src="./imagens-catalogo/batman.jpg" alt="Kit festa Batman">
                    <button class="btn-batman">Kit festa batman</button>
                </div>
                <div class="catalog-item">
                    <img src="./imagens-catalogo/toy-story.jpg" alt="Kit festa Toy Story">
                    <button class="btn-toy">Kit festa Toy Story</button>
                </div>
            </div>
        </section>
    </main>

    <footer> 
        <p>© 2025 DecorPraty. Todos os direitos reservados.</p> 
    </footer>
    <script>
        const buttons = document.querySelectorAll('.catalog-item button');
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const kitName = button.textContent.toLowerCase().replace(/\s/g, '-').replace('kit-festa-', '');
                window.location.href = `kit-${kitName}.html`;
            });
        });
    </script>
</body>
</html>
